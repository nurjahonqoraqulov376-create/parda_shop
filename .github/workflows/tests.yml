name: Testlar

# Har bir push va pull request'da testlar avtomatik ishlaydi — buzilgan kod
# sezilmay qolib ketmasligi uchun.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-key-not-used-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      # Testlar tarmoqqa chiqmasin.
      AUTO_TRANSLATE: "False"
      # Suhbat yordamchisi ham tarmoqqa chiqmasin.
      AI_SUPPORT: "False"
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Sozlamalarni tekshirish
        run: python manage.py check

      - name: Migratsiyalar to'liqmi
        run: python manage.py makemigrations --check --dry-run

      - name: Testlar
        run: python manage.py test -v 2
